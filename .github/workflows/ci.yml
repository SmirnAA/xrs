name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -S warning bin/* lib/xrs/build.sh install.sh completions/xrs.bash tests/*.sh
      - name: tests
        run: tests/test_build.sh
